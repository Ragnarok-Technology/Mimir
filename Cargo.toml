[workspace]
resolver = "2"
members = [
    "crates/mimir-core",
    "crates/mimir-whistle",
    "crates/mimir-audio",
    "crates/mimir-diarize",
    "crates/mimir-store",
    "crates/mimir-bridge",
    "crates/mimir-cli",
    "crates/mimir-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
dirs = "6"
eframe = "0.31"
hex = "0.4"
libloading = "0.8"
rubato = "0.16"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1", features = ["v4", "serde"] }
